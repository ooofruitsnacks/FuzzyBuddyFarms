name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

env:
  ODIN_PACKAGE_PATH: .
  BINARY_NAME: Fuzzy_Buddy_Farms

permissions:
  contents: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: latest

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail

          sudo mkdir -p /etc/apt/disabled-sources
          for f in /etc/apt/sources.list.d/*google* \
                   /etc/apt/sources.list.d/*microsoft* \
                   /etc/apt/sources.list.d/*chrome*; do
            [ -e "$f" ] && sudo mv "$f" /etc/apt/disabled-sources/ || true
          done

          for attempt in 1 2 3; do
            echo "=== apt-get update (attempt ${attempt}/3) ==="
            if sudo apt-get update; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "apt-get update failed after 3 attempts." >&2
              exit 1
            fi
            sudo rm -rf /var/lib/apt/lists/*
            sleep 15
          done

          sudo apt-get install -y --no-install-recommends \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libasound2-dev


      - name: Check
        run: odin check ${{ env.ODIN_PACKAGE_PATH }}

  build:
    name: ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux (amd64 — glibc 2.39+)
            target: linux_amd64
            output: Fuzzy_Buddy_Farms
            asset: Fuzzy_Buddy_Farms-linux-amd64

          - os: ubuntu-24.04-arm
            name: Linux (arm64 — glibc 2.39+, Ubuntu 24.04 / Debian 13+)
            target: linux_arm64
            output: Fuzzy_Buddy_Farms
            asset: Fuzzy_Buddy_Farms-linux-arm64

          - os: windows-latest
            name: Windows (amd64 — Intel or AMD)
            target: windows_amd64
            output: Fuzzy_Buddy_Farms.exe
            asset: Fuzzy_Buddy_Farms-windows-amd64

          - os: macos-15-intel
            name: macOS (amd64 — Intel)
            target: darwin_amd64
            output: Fuzzy_Buddy_Farms
            asset: Fuzzy_Buddy_Farms-macos-amd64

          - os: macos-15
            name: macOS (arm64 — Apple Silicon)
            target: darwin_arm64
            output: Fuzzy_Buddy_Farms
            asset: Fuzzy_Buddy_Farms-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: latest

      - name: Verify Odin architecture matches runner
        if: runner.os != 'Windows'
        run: |
          echo "Runner arch: $(uname -m)"
          odin version
          file "$(command -v odin)" || true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail

          sudo mkdir -p /etc/apt/disabled-sources
          for f in /etc/apt/sources.list.d/*google* \
                   /etc/apt/sources.list.d/*microsoft* \
                   /etc/apt/sources.list.d/*chrome*; do
            [ -e "$f" ] && sudo mv "$f" /etc/apt/disabled-sources/ || true
          done

          for attempt in 1 2 3; do
            echo "=== apt-get update (attempt ${attempt}/3) ==="
            if sudo apt-get update; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "apt-get update failed after 3 attempts." >&2
              exit 1
            fi
            sudo rm -rf /var/lib/apt/lists/*
            sleep 15
          done

          sudo apt-get install -y --no-install-recommends \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libasound2-dev


      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          odin build ${{ env.ODIN_PACKAGE_PATH }} \
            -out:${{ matrix.output }} \
            -target:${{ matrix.target }} \
            -o:speed \
            -extra-linker-flags:"-rpath @executable_path/../Frameworks -rpath @executable_path"

      - name: Build (Linux / Windows)
        if: runner.os != 'macOS'
        run: odin build ${{ env.ODIN_PACKAGE_PATH }} -out:${{ matrix.output }} -target:${{ matrix.target }} -o:speed

      - name: Stage release folder (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release/${{ matrix.asset }}
          cp ${{ matrix.output }} release/${{ matrix.asset }}/
          cp -r assets release/${{ matrix.asset }}/
          cd release
          zip -r ${{ matrix.asset }}.zip ${{ matrix.asset }}

      - name: Bundle .app (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP="release/${{ matrix.asset }}/Fuzzy_Buddy_Farms.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          mkdir -p "$APP/Contents/Frameworks"

          cp ${{ matrix.output }} "$APP/Contents/MacOS/"
          cp packaging/macos/Info.plist "$APP/Contents/Info.plist"
          cp packaging/macos/icon.icns "$APP/Contents/Resources/"
          cp -r assets "$APP/Contents/Resources/"
          chmod +x "$APP/Contents/MacOS/Fuzzy_Buddy_Farms"

          echo "--- Linked libraries before fixup ---"
          otool -L "$APP/Contents/MacOS/Fuzzy_Buddy_Farms"

          ODIN_BIN="$(command -v odin)"
          ODIN_DIR="$(dirname "$(readlink -f "$ODIN_BIN" || echo "$ODIN_BIN")")"
          for DYLIB in $(otool -L "$APP/Contents/MacOS/Fuzzy_Buddy_Farms" \
                          | awk '/raylib|\.dylib/ {print $1}' \
                          | grep -v '^/usr/lib' \
                          | grep -v '^/System' || true); do
            BASE="$(basename "$DYLIB")"
            SRC=""
            if [ -f "$DYLIB" ]; then
              SRC="$DYLIB"
            else
              SRC="$(find "$ODIN_DIR/vendor/raylib" -name "$BASE" -print -quit 2>/dev/null || true)"
            fi
            if [ -n "$SRC" ] && [ -f "$SRC" ]; then
              echo "Bundling $BASE from $SRC"
              cp "$SRC" "$APP/Contents/Frameworks/"
              install_name_tool -change "$DYLIB" "@rpath/$BASE" \
                "$APP/Contents/MacOS/Fuzzy_Buddy_Farms"
            else
              echo "NOTE: could not locate $BASE — assuming static link"
            fi
          done

          echo "--- Linked libraries after fixup ---"
          otool -L "$APP/Contents/MacOS/Fuzzy_Buddy_Farms"

          codesign --force --deep --sign - "$APP"

          cd release
          zip -r ${{ matrix.asset }}.zip "${{ matrix.asset }}"

      - name: Stage release folder (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release/${{ matrix.asset }}"
          Copy-Item "${{ matrix.output }}" "release/${{ matrix.asset }}/"
          Copy-Item "assets" "release/${{ matrix.asset }}/assets" -Recurse
          Compress-Archive -Path "release/${{ matrix.asset }}" -DestinationPath "release/${{ matrix.asset }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}.zip

  build-raspberry-pi:
    name: Raspberry Pi OS (arm64 — Debian 12 / glibc 2.36)
    needs: check
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build for Raspberry Pi OS (Debian 12 / glibc 2.36)
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/src" -w /src \
            debian:12 bash -euo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                curl ca-certificates clang binutils \
                libx11-dev libxrandr-dev libxinerama-dev \
                libxcursor-dev libxi-dev libgl1-mesa-dev libasound2-dev

              ODIN_VERSION=dev-2026-09
              curl -fL -o /tmp/odin.tar.gz \
                "https://github.com/odin-lang/Odin/releases/download/${ODIN_VERSION}/odin-linux-arm64-${ODIN_VERSION}.tar.gz"
              mkdir -p /opt/odin
              tar -xzf /tmp/odin.tar.gz -C /opt/odin
              ODIN_BIN=$(find /opt/odin -maxdepth 3 -type f -name odin | head -1)
              chmod +x "$ODIN_BIN"
              export ODIN_ROOT=$(dirname "$ODIN_BIN")
              "$ODIN_BIN" version

              echo "=== PREFLIGHT: locate shim source ==="
              ls -la packaging/raspberrypi/ 2>/dev/null \
                || { echo "FATAL: packaging/raspberrypi/ does not exist in the repo"; exit 1; }
              test -f packaging/raspberrypi/isoc23_compat.c \
                || { echo "FATAL: isoc23_compat.c is not committed"; exit 1; }

              echo "=== Compiling C23 compatibility shim ==="
              clang -c packaging/raspberrypi/isoc23_compat.c -o /tmp/isoc23_compat.o
              nm -g --defined-only /tmp/isoc23_compat.o | grep isoc23 \
                || { echo "FATAL: shim compiled but defines no __isoc23_* symbols"; exit 1; }

              echo "=== Injecting shim into libraylib.a ==="
              RAYLIB_A="$ODIN_ROOT/vendor/raylib/linux-arm64/libraylib.a"
              ar r "$RAYLIB_A" /tmp/isoc23_compat.o
              ranlib "$RAYLIB_A"
              ar t "$RAYLIB_A" | grep isoc23_compat.o \
                || { echo "FATAL: ar did not add the shim member"; exit 1; }

              echo "=== Building ==="
              "$ODIN_BIN" build . -out:Fuzzy_Buddy_Farms -o:speed
            '

      - name: Verify glibc floor
        run: |
          MAX=$(objdump -T ${{ env.BINARY_NAME }} | grep -o 'GLIBC_[0-9.]\+' | sort -uV | tail -1)
          echo "Highest glibc symbol required: $MAX"
          if [ "$(printf '%s\nGLIBC_2.36\n' "$MAX" | sort -V | tail -1)" != "GLIBC_2.36" ]; then
            echo "ERROR: requires $MAX but Raspberry Pi OS Bookworm only has GLIBC_2.36"
            exit 1
          fi
          echo "OK — runs on Raspberry Pi OS Bookworm and Trixie"

      - name: Stage release folder
        run: |
          set -euo pipefail
          DIR=release/Fuzzy_Buddy_Farms-raspberrypi-arm64
          mkdir -p "$DIR"
          cp ${{ env.BINARY_NAME }} "$DIR/"
          cp -r assets "$DIR/"
          cp packaging/raspberrypi/RUN_ME.sh "$DIR/"
          chmod +x "$DIR/RUN_ME.sh"
          cp packaging/raspberrypi/FuzzyBuddyFarms.desktop "$DIR/"
          chmod +x "$DIR/FuzzyBuddyFarms.desktop"
          chmod +x "$DIR/${{ env.BINARY_NAME }}"

          cat > "$DIR/README.txt" <<'EOF'
          Fuzzy Buddy Farms — Raspberry Pi (arm64)
          ========================================

          START THE GAME:

              ./RUN_ME.sh

          Do NOT run ./Fuzzy_Buddy_Farms directly — it will crash.

          WHY: The Raspberry Pi's GPU reports OpenGL 3.1, but the game's
          graphics library requests 3.3. RUN_ME.sh sets an environment
          variable that tells the driver to advertise 3.3, which works
          because the hardware supports the features actually used.

          If the game window never appears, install the runtime libraries:

              sudo apt update
              sudo apt install -y libx11-6 libxrandr2 libxinerama1 \
                libxcursor1 libxi6 libgl1 libasound2t64

          Requires 64-bit Raspberry Pi OS. Check with:  uname -m
          It must print "aarch64" (not "armv7l").

          Report issues:
          https://github.com/oooFruitSnacks/FuzzyBuddyFarms/issues
          EOF

          cd release
          zip -r Fuzzy_Buddy_Farms-raspberrypi-arm64.zip Fuzzy_Buddy_Farms-raspberrypi-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fuzzy_Buddy_Farms-raspberrypi-arm64
          path: release/Fuzzy_Buddy_Farms-raspberrypi-arm64.zip

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LLVM SDK extension
        run: |
          flatpak install -y --noninteractive flathub \
            org.freedesktop.Sdk.Extension.llvm20//25.08
          flatpak list --runtime | grep llvm20

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.7
        with:
          bundle: Fuzzy_Buddy_Farms-${{ matrix.arch }}.flatpak
          manifest-path: packaging/flatpak/io.github.ooofruitsnacks.FuzzyBuddyFarms.yml
          cache-key: flatpak-${{ matrix.arch }}-${{ hashFiles('packaging/flatpak/*.yml', 'packaging/flatpak/*.sh') }}
          arch: ${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fuzzy_Buddy_Farms-${{ matrix.arch }}.flatpak
          path: Fuzzy_Buddy_Farms-${{ matrix.arch }}.flatpak

  release:
    name: Create Release
    needs: [ build, build-raspberry-pi, flatpak ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts (debug)
        run: find artifacts -type f

      - name: Flatten artifacts and generate SHA256 checksums
        run: |
          set -euo pipefail
          mkdir -p release-files
          find artifacts -type f \( -name "*.zip" -o -name "*.flatpak" \) \
            -exec cp {} release-files/ \;
          cd release-files
          sha256sum * > checksums.txt
          echo "Generated checksums:"
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true

