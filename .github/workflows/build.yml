name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

env:
  ODIN_PACKAGE_PATH: .
  BINARY_NAME: Fuzzy_Buddy_Farms

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux (amd64)
            target: linux_amd64
            output: Fuzzy_Buddy_Farms
            asset: Fuzzy_Buddy_Farms-linux-amd64

          - os: ubuntu-latest
            name: Linux (arm64 / Raspberry Pi)
            target: linux_arm64
            output: Fuzzy_Buddy_Farms
            asset: Fuzzy_Buddy_Farms-linux-arm64

          - os: windows-latest
            name: Windows (amd64)
            target: windows_amd64
            output: Fuzzy_Buddy_Farms.exe
            asset: Fuzzy_Buddy_Farms-windows-amd64

          - os: macos-15-intel
            name: macOS (amd64)
            target: darwin_amd64
            output: Fuzzy_Buddy_Farms
            asset: Fuzzy_Buddy_Farms-macos-amd64

          - os: macos-latest
            name: macOS (arm64)
            target: darwin_arm64
            output: Fuzzy_Buddy_Farms
            asset: Fuzzy_Buddy_Farms-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: latest

      - name: Install Linux dependencies
        if: matrix.target == 'linux_amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libasound2-dev

      - name: Install ARM64 cross-compilation tools
        if: matrix.target == 'linux_arm64'
        run: |
          set -e
          sudo dpkg --add-architecture arm64
          CODENAME=$(lsb_release -cs)

          sudo sed -i 's/^deb \([^[]\)/deb [arch=amd64] \1/' /etc/apt/sources.list || true
          sudo sed -i 's/^deb-src \([^[]\)/deb-src [arch=amd64] \1/' /etc/apt/sources.list || true

          for f in /etc/apt/sources.list.d/*.sources; do
            [ -e "$f" ] || continue
            if ! grep -q '^Architectures:' "$f"; then
              sudo sed -i '/^Signed-By:/i Architectures: amd64' "$f" || true
            fi
          done
          for f in /etc/apt/sources.list.d/*.list; do
            [ -e "$f" ] || continue
            sudo sed -i 's/^deb \([^[]\)/deb [arch=amd64] \1/' "$f" || true
          done

          sudo tee /etc/apt/sources.list.d/arm64-ports.sources > /dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: ${CODENAME} ${CODENAME}-updates ${CODENAME}-security ${CODENAME}-backports
          Components: main restricted universe multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

          sudo apt-get update

          sudo apt-get install -y \
            lld \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libx11-dev:arm64 \
            libgcc-s1:arm64 \
            libstdc++6:arm64 \
            libxrandr-dev:arm64 \
            libxinerama-dev:arm64 \
            libxcursor-dev:arm64 \
            libxi-dev:arm64 \
            libgl1-mesa-dev:arm64 \
            libasound2-dev:arm64

      - name: Build (Linux arm64 cross-compile)
        if: matrix.target == 'linux_arm64'
        run: |
          set -e
          GCC_DIR=$(dirname $(aarch64-linux-gnu-gcc -print-libgcc-file-name))
          echo "Using GCC cross dir: $GCC_DIR"
          odin build ${{ env.ODIN_PACKAGE_PATH }} -out:${{ matrix.output }} -target:${{ matrix.target }} -o:speed \
            -extra-linker-flags:"-fuse-ld=lld --target=aarch64-linux-gnu -B${GCC_DIR} -L${GCC_DIR} -L/usr/lib/aarch64-linux-gnu -L/usr/aarch64-linux-gnu/lib -L/lib/aarch64-linux-gnu"



      - name: Build
        if: matrix.target != 'linux_arm64'
        run: odin build ${{ env.ODIN_PACKAGE_PATH }} -out:${{ matrix.output }} -target:${{ matrix.target }} -o:speed

      - name: Stage release folder (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release/${{ matrix.asset }}
          cp ${{ matrix.output }} release/${{ matrix.asset }}/
          cp -r assets release/${{ matrix.asset }}/
          cd release
          zip -r ${{ matrix.asset }}.zip ${{ matrix.asset }}

      - name: Bundle .app (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="release/${{ matrix.asset }}/Fuzzy_Buddy_Farms.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          cp ${{ matrix.output }} "$APP/Contents/MacOS/"
          cp packaging/macos/Info.plist "$APP/Contents/Info.plist"
          cp packaging/macos/icon.icns "$APP/Contents/Resources/"
          cp -r assets "$APP/Contents/Resources/"
          chmod +x "$APP/Contents/MacOS/Fuzzy_Buddy_Farms"
          codesign --force --deep --sign - "$APP"
          cd release
          zip -r ${{ matrix.asset }}.zip "${{ matrix.asset }}"

      - name: Stage release folder (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release/${{ matrix.asset }}"
          Copy-Item "${{ matrix.output }}" "release/${{ matrix.asset }}/"
          Copy-Item "assets" "release/${{ matrix.asset }}/assets" -Recurse
          Compress-Archive -Path "release/${{ matrix.asset }}" -DestinationPath "release/${{ matrix.asset }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}.zip

   release:
     name: Create Release
     needs: build
     if: startsWith(github.ref, 'refs/tags/v')
     runs-on: ubuntu-latest
     permissions:
       contents: write
     steps:
       - name: Download all artifacts
         uses: actions/download-artifact@v4
         with:
           path: artifacts

       - name: List downloaded artifacts (debug)
         run: find artifacts -type f

       - name: Flatten artifacts and generate SHA256 checksums
         run: |
           mkdir -p release-files
           find artifacts -name "*.zip" -exec cp {} release-files/ \;
           cd release-files
           sha256sum *.zip > checksums.txt
           echo "Generated checksums:"
           cat checksums.txt

       - name: Create GitHub Release
         uses: softprops/action-gh-release@v2
         with:
           files: release-files/*
           generate_release_notes: true
