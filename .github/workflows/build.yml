name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

env:
  ODIN_PACKAGE_PATH: .
  BINARY_NAME: FuzzyBuddyFarms

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux (amd64)
            target: linux_amd64
            output: FuzzyBuddyFarms
            asset: FuzzyBuddyFarms-linux-amd64

          - os: windows-latest
            name: Windows (amd64)
            target: windows_amd64
            output: FuzzyBuddyFarms.exe
            asset: FuzzyBuddyFarms-windows-amd64

          - os: macos-15-intel
            name: macOS (amd64)
            target: darwin_amd64
            output: FuzzyBuddyFarms
            asset: FuzzyBuddyFarms-macos-amd64

          - os: macos-latest
            name: macOS (arm64)
            target: darwin_arm64
            output: FuzzyBuddyFarms
            asset: FuzzyBuddyFarms-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: latest

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libasound2-dev

      - name: Build
        run: odin build ${{ env.ODIN_PACKAGE_PATH }} -out:${{ matrix.output }} -target:${{ matrix.target }} -o:speed
      
      - name: Stage release folder (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p release/${{ matrix.asset }}
          cp ${{ matrix.output }} release/${{ matrix.asset }}/
          cp -r assets release/${{ matrix.asset }}/
          cd release
          zip -r ${{ matrix.asset }}.zip ${{ matrix.asset }}

      - name: Stage release folder (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir release\${{ matrix.asset }}
          copy ${{ matrix.output }} release\${{ matrix.asset }}\
          xcopy assets release\${{ matrix.asset }}\assets\ /E /I
          cd release
          Compress-Archive -Path ${{ matrix.asset }} -DestinationPath ${{ matrix.asset }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}.zip

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts (debug)
        run: find artifacts -type f
      - name: Build
        run: odin build ${{ env.ODIN_PACKAGE_PATH }} -out:${{ matrix.output }} -target:${{ matrix.target }} -o:speed

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
