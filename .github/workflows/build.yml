name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

env:
  ODIN_PACKAGE_PATH: .
  BINARY_NAME: FuzzyBuddyFarms

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux (amd64)
            target: linux_amd64
            output: Fuzzy_Buddy_Farms
            asset: FuzzyBuddyFarms-linux-amd64

          - os: ubuntu-latest
            name: Linux (arm64 / Raspberry Pi)
            target: linux_arm64
            output: Fuzzy_Buddy_Farms
            asset: FuzzyBuddyFarms-linux-arm64

          - os: windows-latest
            name: Windows (amd64)
            target: windows_amd64
            output: Fuzzy_Buddy_Farms.exe
            asset: FuzzyBuddyFarms-windows-amd64

          - os: macos-15-intel
            name: macOS (amd64)
            target: darwin_amd64
            output: Fuzzy_Buddy_Farms
            asset: FuzzyBuddyFarms-macos-amd64

          - os: macos-latest
            name: macOS (arm64)
            target: darwin_arm64
            output: Fuzzy_Buddy_Farms
            asset: FuzzyBuddyFarms-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: latest

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libasound2-dev

      - name: Install ARM64 cross-compilation tools
        if: matrix.target == 'linux_arm64'
        run: |
          sudo dpkg --add-architecture arm64

          CODENAME=$(lsb_release -cs)

          sudo sed -i "s/^deb /deb [arch=amd64] /" /etc/apt/sources.list
          sudo sed -i "s/^deb-src /deb-src [arch=amd64] /" /etc/apt/sources.list

          sudo tee /etc/apt/sources.list.d/arm64.list > /dev/null <<EOF
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME} main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}-security main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}-backports main restricted universe multiverse
          EOF

          sudo apt-get update

          sudo apt-get install -y \
            lld \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libx11-dev:arm64 \
            libxrandr-dev:arm64 \
            libxinerama-dev:arm64 \
            libxcursor-dev:arm64 \
            libxi-dev:arm64 \
            libgl1-mesa-dev:arm64 \
            libasound2-dev:arm64
      - name: Build
        run: |
          if [ "${{ matrix.target }}" = "linux_arm64" ]; then
            odin build ${{ env.ODIN_PACKAGE_PATH }} -out:${{ matrix.output }} -target:${{ matrix.target }} -o:speed \
              -extra-linker-flags:"-fuse-ld=lld --target=aarch64-linux-gnu --sysroot=/usr/aarch64-linux-gnu -L/usr/lib/aarch64-linux-gnu"
          else
            odin build ${{ env.ODIN_PACKAGE_PATH }} -out:${{ matrix.output }} -target:${{ matrix.target }} -o:speed
          fi

      - name: Stage release folder (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release/${{ matrix.asset }}
          cp ${{ matrix.output }} release/${{ matrix.asset }}/
          cp -r assets release/${{ matrix.asset }}/
          cd release
          zip -r ${{ matrix.asset }}.zip ${{ matrix.asset }}

      - name: Bundle .app (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="release/${{ matrix.asset }}/FuzzyBuddyFarms.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          cp ${{ matrix.output }} "$APP/Contents/MacOS/"
          cp packaging/macos/Info.plist "$APP/Contents/Info.plist"
          cp packaging/macos/icon.icns "$APP/Contents/Resources/"
          cp -r assets "$APP/Contents/Resources/"
          chmod +x "$APP/Contents/MacOS/${{ matrix.output }}"
          codesign --force --deep --sign - "$APP"
          cd release
          zip -r ${{ matrix.asset }}.zip "${{ matrix.asset }}"

      - name: Stage release folder (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir release\${{ matrix.asset }}
          copy ${{ matrix.output }} release\${{ matrix.asset }}\
          xcopy assets release\${{ matrix.asset }}\assets\ /E /I
          cd release
          Compress-Archive -Path ${{ matrix.asset }} -DestinationPath ${{ matrix.asset }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}.zip

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts (debug)
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true

