name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

env:
  ODIN_PACKAGE_PATH: .
  BINARY_NAME: FuzzyBuddyFarms

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux (amd64)
            target: linux_amd64
            output: FuzzyBuddyFarms
            asset: FuzzyBuddyFarms-linux-amd64

          - os: windows-latest
            name: Windows (amd64)
            target: windows_amd64
            output: FuzzyBuddyFarms.exe
            asset: FuzzyBuddyFarms-windows-amd64

          - os: macos-15-intel
            name: macOS (amd64)
            target: darwin_amd64
            output: FuzzyBuddyFarms
            asset: FuzzyBuddyFarms-macos-amd64

          - os: macos-latest
            name: macOS (arm64)
            target: darwin_arm64
            output: FuzzyBuddyFarms
            asset: FuzzyBuddyFarms-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: latest

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libasound2-dev

      - name: Build
        run: odin build ${{ env.ODIN_PACKAGE_PATH }} -out:${{ matrix.output }} -target:${{ matrix.target }} -o:speed

